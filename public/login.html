<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="robots" content="noindex,nofollow">
  <title>AnivoFlix Admin Login</title>
  <link rel="stylesheet" href="/assets/admin.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:20px}
    .login{width:min(430px,100%);background:#121216;border:1px solid #24242a;border-radius:22px;padding:28px;box-shadow:0 25px 80px rgba(0,0,0,.35)}
    .logo{text-align:center;font-size:30px;font-weight:950;margin-bottom:8px}
    .logo span{color:#ffc63c}
    .sub{text-align:center;color:#888;margin-bottom:25px}
    .login label{display:block;margin:14px 0;color:#aaa}
    .login input{width:100%;margin-top:7px}
    .login button{width:100%;margin-top:8px;border:0;border-radius:12px;padding:13px;background:linear-gradient(100deg,#fff05b,#ffad32);font-weight:900;cursor:pointer}
    .error{display:none;color:#ff8f8f;background:#35161a;border:1px solid #64272d;padding:10px;border-radius:10px;margin-top:12px;text-align:center}
  </style>
</head>
<body>
  <form class="login" id="loginForm">
    <div class="logo">Anivo<span>Flix</span></div>
    <div class="sub">Admin Panel Login</div>
    <button type="submit">Sign in with Google</button>
    <div id="error" class="error">Sign-in failed.</div>
  </form>
  <script type="module">
    import { auth, googleProvider, signInWithPopup, onAuthStateChanged } from "/assets/auth.js?v=12";
    const err=document.getElementById("error"),btn=document.querySelector("button");
    onAuthStateChanged(auth,u=>{ if(u) location.replace("/admin"); });
    document.getElementById("loginForm").addEventListener("submit",async e=>{
      e.preventDefault(); err.style.display="none"; btn.disabled=true;
      try{
        await signInWithPopup(auth,googleProvider);
        location.replace("/admin");
      }catch(ex){
        if(ex.code!=="auth/popup-closed-by-user"&&ex.code!=="auth/cancelled-popup-request"){
          err.textContent=ex.code==="auth/unauthorized-domain"?"This domain is not in Firebase Authorized domains.":"Sign-in failed. Please try again.";
          err.style.display="block";
        }
        btn.disabled=false;
      }
    });
  </script>
</body>
</html>
