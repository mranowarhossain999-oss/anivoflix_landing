<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="robots" content="noindex,nofollow">
  <title>AnivoFlix Admin Login</title>
  <link rel="stylesheet" href="/assets/admin.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:20px}
    .login{width:min(430px,100%);background:#121216;border:1px solid #24242a;border-radius:22px;padding:28px;box-shadow:0 25px 80px rgba(0,0,0,.35)}
    .logo{text-align:center;font-size:30px;font-weight:950;margin-bottom:8px}
    .logo span{color:#ffc63c}
    .sub{text-align:center;color:#888;margin-bottom:25px}
    .login label{display:block;margin:14px 0;color:#aaa}
    .login input{width:100%;margin-top:7px}
    .login button{width:100%;margin-top:8px;border:0;border-radius:12px;padding:13px;background:linear-gradient(100deg,#fff05b,#ffad32);font-weight:900;cursor:pointer}
    .error{display:none;color:#ff8f8f;background:#35161a;border:1px solid #64272d;padding:10px;border-radius:10px;margin-top:12px;text-align:center}
  </style>
</head>
<body>
  <form class="login" id="loginForm">
    <div class="logo">Anivo<span>Flix</span></div>
    <div class="sub">Admin Panel Login</div>
    <label>Username<input id="username" autocomplete="username" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">LOGIN</button>
    <div id="error" class="error">Invalid username or password.</div>
  </form>
  <script>
    const USERNAME="Anowar";
    const PASSWORD="Anowar3.0@";
    if(sessionStorage.getItem("anivoflix_admin_auth")==="1") location.replace("/admin");
    document.getElementById("loginForm").addEventListener("submit",e=>{
      e.preventDefault();
      const u=document.getElementById("username").value;
      const p=document.getElementById("password").value;
      if(u===USERNAME && p===PASSWORD){
        sessionStorage.setItem("anivoflix_admin_auth","1");
        location.replace("/admin");
      }else{
        document.getElementById("error").style.display="block";
      }
    });
  </script>
</body>
</html>
